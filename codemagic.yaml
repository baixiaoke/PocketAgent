workflows:
  ios-unsigned:
    name: PocketAgent 无签名 ipa
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "PocketAgent.xcodeproj"
        SCHEME: "PocketAgent"
        XCODEGEN_VERSION: "2.42.0"
    scripts:
      - name: 准备 xcodegen（brew 失败就下载二进制）
        script: |
          set -e
          if command -v xcodegen >/dev/null 2>&1; then
            echo "xcodegen 已存在：$(xcodegen --version)"
            exit 0
          fi
          echo "尝试 brew 安装…"
          brew install xcodegen >/dev/null 2>&1 || echo "brew 安装失败，改下载二进制"
          if command -v xcodegen >/dev/null 2>&1; then
            echo "brew 安装成功：$(xcodegen --version)"
            exit 0
          fi
          mkdir -p "$HOME/bin"
          curl -fsSL -o /tmp/xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q -o /tmp/xcodegen.zip -d /tmp/xcodegen-dist
          cp -R /tmp/xcodegen-dist/xcodegen/bin/* "$HOME/bin/" 2>/dev/null || \
            find /tmp/xcodegen-dist -name xcodegen -type f -exec cp {} "$HOME/bin/" \;
          chmod +x "$HOME/bin/xcodegen" || true
          export PATH="$HOME/bin:$PATH"
          xcodegen --version

      - name: 生成 Xcode 工程
        script: |
          set -e
          export PATH="$HOME/bin:$PATH"
          cd "$CM_BUILD_DIR"
          xcodegen generate
          ls -la
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: 编译 archive（不签名）
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/PocketAgent.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: 打包 ipa / tipa
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          APP="build/PocketAgent.xcarchive/Products/Applications/PocketAgent.app"
          if [ ! -d "$APP" ]; then
            echo "没找到 .app，实际内容："
            ls -R build/PocketAgent.xcarchive/Products || true
            exit 1
          fi
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry PocketAgent-unsigned.ipa Payload
          cp PocketAgent-unsigned.ipa PocketAgent.tipa
          ls -lh *.ipa *.tipa

    artifacts:
      - build/PocketAgent-unsigned.ipa
      - build/PocketAgent.tipa
      - build/PocketAgent.xcarchive

    publishing:
      email:
        recipients:
          - 292926261@qq.com
        notify:
          success: true
          failure: true

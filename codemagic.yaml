workflows:
  ios-unsigned:
    name: PocketAgent 无签名 ipa
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "PocketAgent.xcodeproj"
        SCHEME: "PocketAgent"
    scripts:
      - name: 安装 xcodegen
        script: |
          brew install xcodegen || true
          xcodegen --version

      - name: 生成工程
        script: |
          cd "$CM_BUILD_DIR"
          xcodegen generate
          ls -la

      - name: 编译（不签名）
        script: |
          cd "$CM_BUILD_DIR"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/PocketAgent.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: 打包 ipa
        script: |
          cd "$CM_BUILD_DIR"
          mkdir -p build/Payload
          cp -R build/PocketAgent.xcarchive/Products/Applications/PocketAgent.app build/Payload/
          cd build
          zip -qry PocketAgent-unsigned.ipa Payload
          cp PocketAgent-unsigned.ipa PocketAgent.tipa
          ls -lh *.ipa *.tipa

    artifacts:
      - build/PocketAgent-unsigned.ipa
      - build/PocketAgent.tipa
      - build/PocketAgent.xcarchive

    publishing:
      email:
        recipients:
          - 292926261@qq.com
        notify:
          success: true
          failure: true
